# NetHack for KIM-1: code in the 24 KB flash ROM at $A000, the rest of the
# program in a RAM image loaded to $2000 (from NETHACK.BIN on the SD card,
# or by paper tape), then game state, then the cc65 software stack.

FEATURES {
    STARTADDRESS: default = $A000;
    CONDES: type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__,
            segment = RODATA,
            import = __CALLIRQ__;
}

SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0800;
    __STACKSTART__: type = weak, value = $A000;
    __ZPSTART__:    type = weak, value = $0040;
}

MEMORY {
    ZP:     file = "",                start = __ZPSTART__, size = $0060, define = yes;
    # The ROM ends below $FC00: there the KIM-1 shows its monitor ROM again
    # (as $1C00), for the 6502 vectors.
    ROM:    file = %O,                start = $A000,       size = $5C00, define = yes;
    RAMIMG: file = "nethack-ram.bin", start = $2000,       size = $7800, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    STARTUP:  load = ROM,    type = ro;
    LOWCODE:  load = ROM,    type = ro, optional = yes;
    ONCE:     load = ROM,    type = ro, optional = yes;
    CODE:     load = ROM,    type = ro;
    RODATA:   load = ROM,    type = ro;
    RHEADER:  load = RAMIMG, type = ro, define = yes;
    RCODE:    load = RAMIMG, type = ro, define = yes;
    RRODATA:  load = RAMIMG, type = ro, define = yes;
    DATA:     load = RAMIMG, type = rw, define = yes;
    BSS:      load = RAMIMG, type = bss, define = yes;
}
